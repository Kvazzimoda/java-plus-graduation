spring:
  application:
    name: gateway

  config:
    import: "optional:configserver:"

  cloud:
    config:
      fail-fast: false     # КЛЮЧЕВО
      retry:
        max-attempts: 10
        max-interval: 6000
      discovery:
        enabled: true
        serviceId: config-server

eureka:
  client:
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname:localhost}:${eureka.instance.port:8761}/eureka/
